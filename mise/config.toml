[tool_alias]
codex = "aqua:openai/codex"

[settings]
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.tmux.conf" = "../.tmux.conf"
"~/.zshrc" = "../.zshrc"
"~/.config/atuin/config.toml" = "../atuin/config.toml"
"~/.config/bat/config" = "../bat/config"
"~/.config/git/delta.gitconfig" = "../git/delta.gitconfig"
"~/.config/k9s/config.yaml" = "../k9s/config.yaml"
"~/.config/k9s/skins/catppuccin-mocha.yaml" = "../k9s/skins/catppuccin-mocha.yaml"
"~/.config/lazygit/config.yml" = "../lazygit/config.yml"
"~/.config/mise/config.macos.toml" = "config.macos.toml"
"~/.config/mise/config.toml" = "config.toml"
"~/.config/mise/miserc.toml" = "../.miserc.toml"
"~/.config/nvim" = "../nvim"
"~/.config/starship.toml" = "../starship.toml"

